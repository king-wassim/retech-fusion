# =============================================================================
# docker-compose.yml — Re·Tech Fusion
# =============================================================================
# Services:
#   - mosquitto     : MQTT broker (port 1883)
#   - pipeline      : runs `python main.py` once and exits
#   - esp-simulator : long-running, publishes simulated sensor data
#   - dashboard     : Streamlit on http://localhost:8501
# Run: docker compose up --build
# =============================================================================

services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: retech-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  pipeline:
    build: .
    image: retech-fusion:latest
    container_name: retech-pipeline
    command: python main.py
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - CO2_FACTOR_KG_PER_KWH=0.468
      - GAS_PCI_KWH_PER_NM3=10.562
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto

  esp-simulator:
    build: .
    image: retech-fusion:latest
    container_name: retech-esp-simulator
    command: python src/iot/esp_simulator.py
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    restart: unless-stopped

  dashboard:
    build: .
    image: retech-fusion:latest
    container_name: retech-dashboard
    command: streamlit run src/dashboard/app.py
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - CO2_FACTOR_KG_PER_KWH=0.468
      - GAS_PCI_KWH_PER_NM3=10.562
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - pipeline
      - mosquitto
    restart: unless-stopped
